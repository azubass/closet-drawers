<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Closet Drawers｜ファッションくじ 2〜6人 最適配置テスト v1</title>
<style>
:root{
  --bg:#f7f1ea;
  --paper:#fffdf9;
  --ink:#3b291f;
  --orange:#d77b3f;
  --line:#e8c7aa;
  --muted:#9a765f;
  --soft:#fbf1e8;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
}
.wrap{max-width:1400px;margin:auto;padding:28px 18px 60px}
h1{font-size:22px;margin:0 0 6px}
.lead{font-size:12px;line-height:1.8;color:var(--muted);margin-bottom:18px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tabs button{
  border:1px solid var(--line);background:#fff;color:var(--ink);
  border-radius:999px;padding:9px 14px;font-weight:700;cursor:pointer
}
.tabs button.active{background:var(--orange);color:#fff;border-color:var(--orange)}
.canvas-wrap{display:none;justify-content:center}
.canvas-wrap.show{display:flex}
.tpl{
  width:min(94vw,850px);
  aspect-ratio:1/1;
  background:var(--paper);
  position:relative;overflow:hidden;
  border:1px solid #efe1d5;
  box-shadow:0 10px 34px rgba(85,55,35,.08);
  padding:3.4% 3.2% 2.3%;
}
.header{
  height:14%;
  display:flex;align-items:flex-start;justify-content:space-between;
}
.brand{display:flex;align-items:flex-start;gap:10px}
.brand img.mark{width:62px;height:auto}
.brand img.word{width:220px;height:auto;margin-top:6px}
.brand-sub{font-size:15px;font-weight:700;color:var(--orange);margin-top:-4px}
.hash{text-align:right}
.hash-main{font-size:52px;line-height:1;font-weight:800;color:var(--orange);letter-spacing:.06em}
.hash-line{height:3px;background:var(--orange);margin:13px 0 10px;border-radius:3px}
.hash-sub{font-size:16px;font-weight:700}
.body{height:76%;position:relative}
.footer{
  height:10%;display:flex;align-items:flex-end;justify-content:center;
  font-size:14px;font-weight:700;letter-spacing:.04em
}
.footer span{color:var(--orange);margin:0 8px}
.avatar{
  position:absolute;border:2px solid var(--line);
  border-radius:18px;background:#fff;
}
.avatar:before,.avatar:after{
  content:"";position:absolute;width:28px;height:28px;border-color:var(--line)
}
.avatar:before{left:-2px;top:-2px;border-left:3px solid var(--line);border-top:3px solid var(--line);border-radius:12px 0 0 0}
.avatar:after{right:-2px;bottom:-2px;border-right:3px solid var(--line);border-bottom:3px solid var(--line);border-radius:0 0 12px 0}
.avatar .spark{position:absolute;left:16px;top:22px;color:#e9aa7d;font-size:24px}
.namebox{
  position:absolute;height:38px;border:2px solid var(--line);border-radius:12px;background:#fff;
  display:flex;align-items:center;padding:0 13px;font-size:16px;font-weight:800
}
.info{
  position:absolute;border:1.5px solid var(--line);border-radius:18px;
  background:rgba(251,241,232,.68);padding:18px 20px
}
.info .row{margin-bottom:20px}
.info .lbl{font-size:17px;font-weight:800;margin-bottom:7px}
.info .line{height:30px;border-bottom:2px solid #e7a477}
.memo .dots{height:38px;border-bottom:2px dotted #e7a477}
.info-title{font-size:13px;letter-spacing:.12em;color:var(--orange);font-weight:800;margin-bottom:14px}
.decor-ribbon{position:absolute;right:18%;top:3%;font-size:34px;color:#e2a274}
.note{margin-top:14px;text-align:center;font-size:11px;color:var(--muted)}

/* 2人 */
.p2 .a1{left:3%;top:17%;width:28%;height:42%}
.p2 .n1{left:3%;top:61%;width:28%}
.p2 .a2{left:34%;top:17%;width:28%;height:42%}
.p2 .n2{left:34%;top:61%;width:28%}
.p2 .info{right:2%;top:12%;width:33%;height:65%}

/* 3人 */
.p3 .a1{left:3%;top:10%;width:24%;height:36%}
.p3 .n1{left:3%;top:48%;width:24%}
.p3 .a2{left:30%;top:10%;width:24%;height:36%}
.p3 .n2{left:30%;top:48%;width:24%}
.p3 .a3{left:16.5%;top:57%;width:24%;height:36%}
.p3 .n3{left:16.5%;top:95%;width:24%;transform:translateY(-100%)}
.p3 .info{right:2%;top:10%;width:40%;height:82%}

/* 4人 */
.p4 .a1{left:2%;top:8%;width:21%;height:31.5%}
.p4 .n1{left:2%;top:41%;width:21%}
.p4 .a2{left:25%;top:8%;width:21%;height:31.5%}
.p4 .n2{left:25%;top:41%;width:21%}
.p4 .a3{left:2%;top:53%;width:21%;height:31.5%}
.p4 .n3{left:2%;top:86%;width:21%}
.p4 .a4{left:25%;top:53%;width:21%;height:31.5%}
.p4 .n4{left:25%;top:86%;width:21%}
.p4 .info{right:2%;top:8%;width:49%;height:79%}

/* 5人: 情報を上、アバターを下へ */
.p5 .info{left:2%;right:2%;top:2%;height:31%;display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.p5 .info .row{margin:0}
.p5 .info .memo{grid-column:4}
.p5 .info .dots{height:30px}
.p5 .a1{left:4%;top:39%;width:17.8%;height:26.7%}
.p5 .n1{left:4%;top:67%;width:17.8%}
.p5 .a2{left:23.5%;top:39%;width:17.8%;height:26.7%}
.p5 .n2{left:23.5%;top:67%;width:17.8%}
.p5 .a3{left:43%;top:39%;width:17.8%;height:26.7%}
.p5 .n3{left:43%;top:67%;width:17.8%}
.p5 .a4{left:17%;top:73%;width:17.8%;height:26.7%}
.p5 .n4{left:17%;top:101%;width:17.8%;transform:translateY(-100%)}
.p5 .a5{left:36.5%;top:73%;width:17.8%;height:26.7%}
.p5 .n5{left:36.5%;top:101%;width:17.8%;transform:translateY(-100%)}

/* 6人 */
.p6 .info{left:2%;right:2%;top:2%;height:31%;display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.p6 .info .row{margin:0}
.p6 .info .memo{grid-column:4}
.p6 .info .dots{height:30px}
.p6 .a1{left:4%;top:39%;width:17.8%;height:26.7%}
.p6 .n1{left:4%;top:67%;width:17.8%}
.p6 .a2{left:23.5%;top:39%;width:17.8%;height:26.7%}
.p6 .n2{left:23.5%;top:67%;width:17.8%}
.p6 .a3{left:43%;top:39%;width:17.8%;height:26.7%}
.p6 .n3{left:43%;top:67%;width:17.8%}
.p6 .a4{left:62.5%;top:39%;width:17.8%;height:26.7%}
.p6 .n4{left:62.5%;top:67%;width:17.8%}
.p6 .a5{left:23.5%;top:73%;width:17.8%;height:26.7%}
.p6 .n5{left:23.5%;top:101%;width:17.8%;transform:translateY(-100%)}
.p6 .a6{left:43%;top:73%;width:17.8%;height:26.7%}
.p6 .n6{left:43%;top:101%;width:17.8%;transform:translateY(-100%)}

@media(max-width:720px){
  .wrap{padding:18px 8px 40px}
  .tpl{width:100%}
}
</style>
</head>

<div class="wrap">
  <h1>ファッションくじ 2〜6人用｜人数別最適配置テスト</h1>
  <div class="lead">

function header(){
  return `<div class="header">
    <div class="brand">
      <img class="mark" src="${mark}">
      <div>
        <img class="word" src="${word}">
        <div class="brand-sub">ファッションくじ</div>
      </div>
    </div>
    <div class="hash">
      <div class="hash-main">#クロドロ</div>
      <div class="hash-line"></div>
      <div class="hash-sub">コーデ投稿用テンプレート</div>
    </div>
  </div>`;
}
function avatar(i){
  return `<div class="avatar a${i}"><span class="spark">✦</span></div>
          <div class="namebox n${i}">NAME</div>`;
}
function info(){
  return `<div class="info">
    <div class="info-title">THEME</div>
    <div class="row"><div class="lbl">COLOR</div><div class="line"></div></div>
    <div class="row"><div class="lbl">STYLE</div><div class="line"></div></div>
    <div class="row"><div class="lbl">POINT</div><div class="line"></div></div>
    <div class="row memo"><div class="lbl">MEMO</div><div class="dots"></div><div class="dots"></div></div>
  </div>`;
}
function render(n){
  const av=Array.from({length:n},(_,i)=>avatar(i+1)).join('');
  document.getElementById('mount').innerHTML=
    `<div class="canvas-wrap show">
      <div class="tpl p${n}">
        ${header()}
        <div class="body">${av}${info()}<div class="decor-ribbon">⌁</div></div>
        <div class="footer">ファッションくじで作ったコーデは <span>#クロドロ</span> をつけて投稿してね♡</div>
      </div>
    </div>
    <div class="note">${n}人用｜アバター枠は縦3：横2を基準にした専用レイアウト</div>`;
}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');render(+b.dataset.n);
});
render(2);
</script>
</body>
</html>
