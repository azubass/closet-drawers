<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Closet Drawers｜投稿テンプレート テスト v7 今週テンプレート反映</title>
<style>
:root{--bg:#fbf8f4;--ink:#3d291f;--muted:#9a765f;--orange:#d88449;--line:#e6c9b4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
.wrap{max-width:920px;margin:auto;padding:calc(24px + env(safe-area-inset-top)) 18px calc(70px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;padding:8px 0 30px}
header a{color:#b17450;text-decoration:none;font:12px Georgia,serif;letter-spacing:.14em}
h1{font:400 clamp(36px,7vw,58px) Georgia,serif;text-align:center;margin:4px 0 4px}
.sub{text-align:center;color:#aa7a5d;letter-spacing:.1em;font-size:14px;margin-bottom:30px}
.panel{border:1px solid var(--line);border-radius:24px;background:#fffdfb;padding:22px}
.step{text-align:center;font:700 17px Georgia,serif;letter-spacing:.13em;color:#765443}
.help{text-align:center;color:#9d775f;font-size:13px;margin-top:8px}
.people{max-width:700px;margin:18px auto 0;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.people button{border:1px solid var(--line);background:#fff;color:#6b4b3a;border-radius:999px;padding:14px 8px;font-size:15px;font-weight:700}
.people button.active{background:var(--orange);color:#fff;border-color:var(--orange)}
.current{text-align:center;color:#9a725c;margin:22px 0 16px;font-size:13px}
.templates{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.card{border:1px solid var(--line);border-radius:18px;background:#fff;padding:12px}
.card h2{font-size:15px;text-align:center;margin:2px 0 10px}
.template-img{width:100%;aspect-ratio:1/1;display:block;border:1px solid #edd7c5;background:#fff;object-fit:contain}
.save{width:100%;margin-top:12px;border:0;border-radius:999px;padding:13px 8px;background:linear-gradient(135deg,#e2a044,#c47b46);color:#fff;font-size:14px;font-weight:700}
.note{font-size:11px;line-height:1.8;color:#9a765f;text-align:center;margin:20px 4px 2px}
@media(max-width:560px){
  .wrap{padding:20px 14px 60px}
  .panel{padding:16px 12px}
  .templates{gap:10px}
  .card{padding:8px}
  .card h2{font-size:12px}
  .save{font-size:12px;padding:11px 5px}
}

.template-img{cursor:zoom-in}
.preview-modal{
  position:fixed;inset:0;z-index:999;
  display:none;align-items:center;justify-content:center;
  padding:calc(18px + env(safe-area-inset-top)) 14px calc(18px + env(safe-area-inset-bottom));
  background:rgba(47,32,24,.82);
}
.preview-modal.show{display:flex}
.preview-inner{width:min(94vw,760px);display:flex;flex-direction:column;gap:10px}
.preview-head{display:flex;align-items:center;justify-content:space-between;color:#fff;font-size:13px}
.preview-close{
  border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.10);
  color:#fff;border-radius:999px;padding:8px 12px;font-size:12px
}
.preview-large{width:100%;height:auto;max-height:82vh;object-fit:contain;background:#fff;border-radius:12px}


.legal-note{
  max-width:820px;
  margin:22px auto 0;
  padding:0 8px;
  color:#9a765f;
  font-size:11px;
  line-height:1.9;
  text-align:center;
}

</style>
</head>
<body>
<main class="wrap">
<header><a href="menu.html">← MENU</a><a href="index.html">LOTTERY</a></header>
<h1>POST TEMPLATE</h1>
<div class="sub">コーデ投稿用テンプレート</div>

<section class="panel">
  <div class="step">SELECT PLAYERS</div>
  <div class="help">使う人数を選んでね。</div>
  <div class="people" id="people">
    <button data-n="1" class="active">1人</button><button data-n="2">2人</button><button data-n="3">3人</button>
    <button data-n="4">4人</button><button data-n="5">5人</button><button data-n="6">6人</button>
  </div>
  <div class="current" id="current">1人用テンプレートを表示中</div>

  <div class="templates">
    <article class="card">
      <h2>ファッションくじ</h2>
      <img id="fashionImg" class="template-img" alt="ファッションくじ 投稿テンプレート">
      <button class="save" data-kind="fashion">画像を保存</button>
    </article>
    <article class="card">
      <h2>今週のファッションくじ</h2>
      <img id="weeklyImg" class="template-img" alt="今週のファッションくじ 投稿テンプレート">
      <button class="save" data-kind="weekly">画像を保存</button>
    </article>
  </div>

  <div class="note">
    「画像を保存」を押すと、iPhoneの共有メニューからそのまま保存できます。
  </div>
</section>

<div class="legal-note">
  本コンテンツで使用しているテンプレートは、Closet Drawers用に制作したオリジナル素材です。ご自由にお使いください。<br>
  Closet Drawers は非公式の個人制作コンテンツであり、ピグパーティおよび運営会社とは関係ありません。
</div>
</main>


<div class="preview-modal" id="previewModal" aria-hidden="true">
  <div class="preview-inner">
    <div class="preview-head">
      <span id="previewTitle">テンプレートプレビュー</span>
      <button class="preview-close" id="previewClose">閉じる</button>
    </div>
    <img class="preview-large" id="previewLarge" alt="テンプレート拡大表示">
  </div>
</div>

let selected = 1;

function render(n){
  selected=n;
  document.querySelectorAll("#people button").forEach(b=>b.classList.toggle("active",Number(b.dataset.n)===n));
  document.getElementById("current").textContent=n+"人用テンプレートを表示中";
  document.getElementById("fashionImg").src=fashion[n];
  document.getElementById("weeklyImg").src=weekly[n];
}
document.getElementById("people").addEventListener("click",e=>{
  const b=e.target.closest("button[data-n]"); if(!b)return; render(Number(b.dataset.n));
});

function dataUrlToFile(dataUrl, filename){
  const [meta, data] = dataUrl.split(",");
  const mime = (meta.match(/data:(.*?);base64/) || [])[1] || "image/png";
  const bin = atob(data);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new File([bytes], filename, {type:mime});
}

function openFallbackImage(src, title){
  const w = window.open("", "_blank");
  if(!w){
    alert("保存画面を開けませんでした。Safariのポップアップ設定をご確認ください。");
    return;
  }
  w.document.write(`<!doctype html>
  <html lang="ja"><head><meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>画像を保存</title>
  <style>
    body{
      margin:0;background:#faf9f7;color:#3d291f;
      font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
      text-align:center
    }
    main{
      max-width:720px;margin:auto;
      padding:calc(24px + env(safe-area-inset-top)) 16px calc(50px + env(safe-area-inset-bottom))
    }
    h1{font:400 32px Georgia,serif;margin:0 0 8px}
    p{font-size:12px;line-height:1.8;color:#8e6d59;margin:0 0 18px}
    img{display:block;width:100%;height:auto;background:#fff;border:1px solid #e6c9b4}
  </style></head><body><main>
    <h1>画像を保存</h1>
    <p>${title}<br>画像を長押しして「写真に保存」を選んでね。</p>
    <img src="${src}" alt="${title}">
  </main></body></html>`);
  w.document.close();
}

async function saveImage(kind){
  const src = kind==="fashion" ? fashion[selected] : weekly[selected];
  const title = kind==="fashion" ? "ファッションくじ" : "今週のファッションくじ";
  const filename = (kind==="fashion" ? "fashion-lottery" : "weekly-fashion-lottery")
    + "-" + selected + "people.png";

  try{
    const file = dataUrlToFile(src, filename);

    if(
      navigator.share &&
      (!navigator.canShare || navigator.canShare({files:[file]}))
    ){
      await navigator.share({
        files:[file],
        title:title + "｜" + selected + "人用"
      });
      return;
    }

    // Non-Web-Share fallback: try ordinary file download first.
    const a = document.createElement("a");
    a.href = src;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();

    // On iOS/Safari where download may not save to Photos, show the image for long-press.
    setTimeout(()=>openFallbackImage(src, title + "｜" + selected + "人用"), 250);
  }catch(err){
    // User cancelling the native share sheet is normal; don't treat it as an error.
    if(err && err.name === "AbortError") return;
    console.error(err);
    openFallbackImage(src, title + "｜" + selected + "人用");
  }
}

document.querySelectorAll(".save").forEach(b=>{
  b.addEventListener("click",()=>saveImage(b.dataset.kind));
});

function openPreview(img){
  const isWeekly = img.id === "weeklyImg";
  document.getElementById("previewLarge").src = img.src;
  document.getElementById("previewTitle").textContent =
    (isWeekly ? "今週のファッションくじ" : "ファッションくじ") + "｜" + selected + "人用";
  document.getElementById("previewModal").classList.add("show");
  document.getElementById("previewModal").setAttribute("aria-hidden","false");
}
function closePreview(){
  document.getElementById("previewModal").classList.remove("show");
  document.getElementById("previewModal").setAttribute("aria-hidden","true");
}
document.querySelectorAll(".template-img").forEach(img=>img.addEventListener("click",()=>openPreview(img)));
document.getElementById("previewClose").addEventListener("click",closePreview);
document.getElementById("previewModal").addEventListener("click",e=>{
  if(e.target.id==="previewModal") closePreview();
});

render(1);
</script>
</body>
