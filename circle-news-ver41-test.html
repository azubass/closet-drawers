<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fbfaf8"><style>*{box-sizing:border-box}body{margin:0;background:#fbfaf8;color:#2b211b;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.wrap{max-width:680px;margin:auto;padding:24px 18px 56px}.back{color:#9b6a45;text-decoration:none;font-size:12px;letter-spacing:.08em}.brand{text-align:center;margin:28px 0 30px}.brand small{display:block;color:#b87544;letter-spacing:.3em;font:10px Georgia}.brand h1{font:26px Georgia,serif;font-weight:500;letter-spacing:.08em;margin:8px 0;border-block:1px solid #c98a4d;padding:12px}.brand p{font-family:"Yu Mincho",serif;font-size:12px;letter-spacing:.16em}.eyebrow{text-align:center;color:#b87544;font:10px Georgia;letter-spacing:.25em}.panel{background:linear-gradient(180deg,#fff,#fffaf5);border:1px solid #ead0b5;border-radius:16px;padding:20px;box-shadow:0 8px 20px rgba(151,91,45,.04)}.btn{display:inline-block;border:1px solid #c98a4d;background:#fffaf4;color:#805536;padding:11px 18px;border-radius:24px;text-decoration:none;font-size:12px;cursor:pointer}.muted{color:#8b6d58;font-size:11px;line-height:1.8}footer{text-align:center;color:#9b806c;font:10px Georgia;margin-top:36px}input{width:100%;padding:13px;border:1px solid #d9b994;border-radius:8px;background:#fffdf9;font-size:16px;color:#2b211b}button{font:inherit}</style><title>CIRCLE NEWS | Closet Drawers TEST</title><style>.item{border-bottom:1px solid #ead0b5;padding:15px 2px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;cursor:pointer}.head h2{font:15px "Yu Mincho",serif;margin:0}.head time{font-size:10px;color:#9b806c;white-space:nowrap}.plus{color:#b87544;font-size:20px}.body{display:none;padding:12px 4px 4px;font-size:12px;line-height:1.9;color:#765d49}.item.open .body{display:block}.archive{margin-top:22px;border:1px solid #ead0b5;border-radius:10px;padding:13px;background:#fffaf4}.archive summary{cursor:pointer;color:#986a45;font-size:12px}</style></head><body><main class="wrap"><a class="back" href="members-home-ver41-test.html">← MEMBERS ONLY</a><header class="brand"><small>CIRCLE INFORMATION</small><h1>CIRCLE NEWS</h1><p>サークルのお知らせ</p></header><section class="panel"><div class="eyebrow">LATEST NEWS</div><article class="item"><div class="head"><h2>お知らせのサンプルタイトル</h2><time>TEST DATE</time><span class="plus">＋</span></div><div class="body">ここにお知らせ本文が入ります。画像は1枚まで、本文の長さに制限は設けない想定です。</div></article><article class="item"><div class="head"><h2>イベント開催のお知らせ（サンプル）</h2><time>TEST DATE</time><span class="plus">＋</span></div><div class="body">イベントの詳細や参加方法などを掲載するエリアです。</div></article></section><details class="archive"><summary>過去のお知らせ　＋</summary><div class="item"><div class="head"><h2>過去のお知らせサンプル</h2><span class="plus">＋</span></div><div class="body">過去記事の本文サンプルです。</div></div></details></main><script>document.querySelectorAll('.item .head').forEach(h=>h.addEventListener('click',()=>h.parentElement.classList.toggle('open')));document.querySelectorAll('.head').forEach(h=>h.addEventListener('click',()=>{const p=h.querySelector('.plus');if(p)p.textContent=h.parentElement.classList.contains('open')?'−':'＋'}));</script></body></html>
