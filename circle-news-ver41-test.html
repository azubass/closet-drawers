<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CIRCLE NEWS | Closet Drawers</title><style>*{box-sizing:border-box}body{margin:0;background:#fbfaf8;color:#2b211b;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.wrap{max-width:700px;margin:auto;padding:22px 18px 60px}.back{color:#9b6a45;text-decoration:none;font-size:12px}.head{text-align:center;margin:34px 0}.head small{font:10px Georgia;letter-spacing:.3em;color:#b87544}.head h1{font:27px Georgia;font-weight:500;border-block:1px solid #c98a4d;padding:12px;margin:9px 0}.head p{font-size:11px;color:#8b6d58}.section{font:10px Georgia;letter-spacing:.2em;color:#b87544;margin:26px 0 10px}.item{border-top:1px solid #e8c49e}.item:last-child{border-bottom:1px solid #e8c49e}.title{width:100%;display:flex;justify-content:space-between;gap:12px;align-items:center;text-align:left;padding:16px 2px;border:0;background:transparent;color:#503a2b;font:15px "Yu Mincho",serif}.title small{display:block;font:10px Georgia;color:#9b806c;margin-bottom:5px}.plus{font:22px Georgia;color:#b87544}.content{display:none;padding:0 4px 18px;font-size:13px;line-height:1.9;color:#6f5948;white-space:pre-wrap}.content.open{display:block}.content img{display:block;width:min(100%,520px);max-height:380px;object-fit:contain;margin:0 0 12px;background:#fff}.past{margin-top:30px}.past-list{display:none}.past-list.open{display:block}.past-link{display:block;width:100%;padding:12px 4px;border:0;border-bottom:1px solid #ead7c4;background:transparent;text-align:left;color:#6f5948;font-size:12px}.empty{font-size:12px;color:#9b806c;padding:16px 0}</style></head><body><main class="wrap"><a class="back" href="members-home-ver41-test.html">← MEMBERS ONLY</a><header class="head"><small>CIRCLE INFORMATION</small><h1>CIRCLE NEWS</h1><p>サークルのお知らせ</p></header><div class="section">LATEST NEWS</div><div id="latest"></div><section class="past"><button class="title" id="pastToggle"><span>過去のお知らせ</span><span class="plus" id="pastPlus">＋</span></button><div class="past-list" id="pastList"></div></section></main><script>const DATA_URL='circle-news-data-ver41-test.json';const $=id=>document.getElementById(id);let archived=[];function date(s){return s?new Date(s+'T00:00:00').toLocaleDateString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit'}):''}function makeArticle(a){const item=document.createElement('article');item.className='item';const b=document.createElement('button');b.className='title';b.innerHTML=`<span><small>${date(a.publishedAt)}</small>${a.title}</span><span class="plus">＋</span>`;const body=document.createElement('div');body.className='content';if(a.image){const im=document.createElement('img');im.src='circle-news-test/'+a.image;im.alt='';body.append(im)}const p=document.createElement('div');p.textContent=a.body||'';body.append(p);b.onclick=()=>{const open=body.classList.toggle('open');b.querySelector('.plus').textContent=open?'－':'＋'};item.append(b,body);return item}fetch(DATA_URL).then(r=>r.json()).then(d=>{const articles=d.articles.slice().sort((a,b)=>b.publishedAt.localeCompare(a.publishedAt));const current=articles.filter(a=>!a.archived),old=articles.filter(a=>a.archived);current.slice(0,5).forEach(a=>$('latest').append(makeArticle(a)));if(!current.length)$('latest').innerHTML='<p class="empty">現在お知らせはありません。</p>';archived=old;$('pastToggle').onclick=()=>{$('pastList').classList.toggle('open');$('pastPlus').textContent=$('pastList').classList.contains('open')?'－':'＋'};old.forEach(a=>{const b=document.createElement('button');b.className='past-link';b.textContent=date(a.publishedAt)+'　'+a.title;b.onclick=()=>{const node=makeArticle(a);$('pastList').append(node);node.querySelector('.content').classList.add('open');node.querySelector('.plus').textContent='－';node.scrollIntoView({behavior:'smooth',block:'center'})};$('pastList').append(b)})}).catch(()=>$('latest').textContent='お知らせデータを読み込めませんでした。');</script><script>if(sessionStorage.getItem('cd-member-entry')!=='1'){location.replace('members-ver41-test.html')}</script></body></html>
