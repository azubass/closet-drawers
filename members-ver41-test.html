<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fbfaf8"><style>*{box-sizing:border-box}body{margin:0;background:#fbfaf8;color:#2b211b;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.wrap{max-width:680px;margin:auto;padding:24px 18px 56px}.back{color:#9b6a45;text-decoration:none;font-size:12px;letter-spacing:.08em}.brand{text-align:center;margin:28px 0 30px}.brand small{display:block;color:#b87544;letter-spacing:.3em;font:10px Georgia}.brand h1{font:26px Georgia,serif;font-weight:500;letter-spacing:.08em;margin:8px 0;border-block:1px solid #c98a4d;padding:12px}.brand p{font-family:"Yu Mincho",serif;font-size:12px;letter-spacing:.16em}.eyebrow{text-align:center;color:#b87544;font:10px Georgia;letter-spacing:.25em}.panel{background:linear-gradient(180deg,#fff,#fffaf5);border:1px solid #ead0b5;border-radius:16px;padding:20px;box-shadow:0 8px 20px rgba(151,91,45,.04)}.btn{display:inline-block;border:1px solid #c98a4d;background:#fffaf4;color:#805536;padding:11px 18px;border-radius:24px;text-decoration:none;font-size:12px;cursor:pointer}.muted{color:#8b6d58;font-size:11px;line-height:1.8}footer{text-align:center;color:#9b806c;font:10px Georgia;margin-top:36px}input{width:100%;padding:13px;border:1px solid #d9b994;border-radius:8px;background:#fffdf9;font-size:16px;color:#2b211b}button{font:inherit}</style><title>MEMBERS ONLY | Closet Drawers TEST</title><style>.doors{height:170px;max-width:320px;margin:18px auto 26px;display:flex;perspective:900px;border:5px solid #9b6a45;background:#f5e4d0;padding:6px;box-shadow:0 10px 22px #9b6a4520}.door{width:50%;background:linear-gradient(110deg,#f7eadb,#e5c6a3);border:1px solid #b7875e;position:relative;transition:transform .85s;transform-origin:left center}.door+ .door{transform-origin:right center}.door:after{content:"✦";position:absolute;top:50%;color:#9b6a45;font-size:13px}.door:first-child:after{right:8px}.door:last-child:after{left:8px}.doors.open .door:first-child{transform:rotateY(-105deg)}.doors.open .door:last-child{transform:rotateY(105deg)}.form{max-width:390px;margin:auto;text-align:center}.form label{display:block;text-align:left;font-size:12px;margin:14px 0 7px}.form button{margin-top:14px;width:100%}.error{color:#a34c36;font-size:12px;min-height:20px}</style></head><body><main class="wrap"><a class="back" href="index-ver41-test.html">← HOME</a><header class="brand"><small>CLOSET DRAWERS</small><h1>MEMBERS ONLY</h1><p>メンバーだけの、小さなクローゼット。</p></header><div class="doors" id="doors" aria-hidden="true"><div class="door"></div><div class="door"></div></div><section class="panel form"><div class="eyebrow">WELCOME</div><p class="muted">アイコトバを入力して、扉を開いてね。</p><form id="entry"><label for="phrase">アイコトバ</label><input id="phrase" autocomplete="off" placeholder="アイコトバを入力" required><button class="btn" type="submit">扉を開く　›</button><p class="error" id="error" aria-live="polite"></p></form></section><p class="muted" style="text-align:center;margin-top:18px">※テストページです。アイコトバの照合は画面上の簡易演出であり、実際のアクセス制限ではありません。</p><footer>Closet Drawers / MEMBERS ONLY</footer></main><script>document.getElementById('entry').addEventListener('submit',e=>{e.preventDefault();const v=document.getElementById('phrase').value.trim();if(v==='コーデ好き'){document.getElementById('error').textContent='';document.getElementById('doors').classList.add('open');setTimeout(()=>location.href='members-home-ver41-test.html',900)}else{document.getElementById('error').textContent='アイコトバが違うみたい。もう一度試してね。'}});</script></body></html>
