const saveBtn=document.getElementById("saveBtn");
const templateImage=document.getElementById("templateImage");
const saveHelp=document.getElementById("saveHelp");
async function dataUrlToFile(dataUrl,filename){const res=await fetch(dataUrl);const blob=await res.blob();return new File([blob],filename,{type:blob.type||"image/jpeg"});}
saveBtn.addEventListener("click",async()=>{
  const src=templateImage.src;
  try{
    const file=await dataUrlToFile(src,"closet-drawers-template.jpg");
    if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:"Closet Drawers 投稿用テンプレート"});
      return;
    }
    const a=document.createElement("a");a.href=src;a.download="closet-drawers-template.jpg";document.body.appendChild(a);a.click();a.remove();
    saveHelp.textContent="保存が始まらない場合は、画像を長押しして保存してね";
  }catch(e){
    if(e && e.name==="AbortError") return;
    window.open(src,"_blank");
    saveHelp.textContent="開いた画像を長押しして「写真に保存」を選んでね";
  }
});
</script></body></html>
