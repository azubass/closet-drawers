<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>画像を保存 | Closet Drawers</title><meta name="robots" content="noindex,nofollow"><style>
*{box-sizing:border-box}body{margin:0;background:#fbfaf8;color:#2b211b;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif}.wrap{max-width:680px;margin:auto;padding:18px 18px 46px;min-height:100vh}:root{--o:#d98232;--terra:#b86635;--line:#e8c49e}.head{text-align:center;padding:28px 0 20px}.kicker{font:600 10px Georgia,serif;letter-spacing:.25em;color:var(--o)}h1{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:30px;margin:9px 0 10px}.lead{font-size:12px;line-height:1.9;color:#765f50}.image-frame{background:#fff;border:1px solid #e3bb93;padding:7px;box-shadow:0 12px 30px rgba(160,95,41,.08)}#saveImage{display:block;width:100%;height:auto;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}.tip{margin:14px 4px 0;padding:13px 14px;background:#fff3e7;border:1px solid #f0d3b5;border-radius:12px;font-size:11px;line-height:1.8;color:#755a47;text-align:center}.back{display:block;width:100%;margin-top:16px;border:1px solid #dfb98f;background:#fffdfa;color:#6d4a34;border-radius:10px;padding:13px;text-align:center;text-decoration:none;font-size:12px}.error{display:none;padding:32px 12px;text-align:center;font-size:12px;line-height:1.9;color:#765f50}footer{margin-top:30px;padding-top:17px;border-top:1px solid var(--line);text-align:center;font-size:9px;line-height:1.8;color:#96755e}</style></head><body><main class="wrap"><section class="head"><div class="kicker">SAVE TEMPLATE</div><h1>画像を保存</h1><div class="lead">画像を長押しして<br>「写真に保存」を選んでください ♡</div></section><div id="imageArea"><div class="image-frame"><img id="saveImage" alt="生成したCloset Drawers投稿テンプレート"></div><div class="tip">iPhone：画像を長押し →「写真に保存」<br>表示されない場合は、少し長めに押してみてね。</div></div><div id="error" class="error">保存する画像が見つかりませんでした。<br>テンプレートをもう一度生成してください。</div><a id="back" class="back" href="index.html">← テンプレートに戻る</a><footer>Closet Drawers / Fashion is self-expression.</footer></main><script>
(function(){
 let data='',back='index.html';
 try{data=sessionStorage.getItem('cd_save_image')||'';back=sessionStorage.getItem('cd_save_return')||back}catch(e){}
 if(!data){try{const x=JSON.parse(window.name||'{}');data=x.cd_save_image||'';back=x.cd_save_return||back}catch(e){}}
 document.getElementById('back').href=back;
 if(data&&data.startsWith('data:image/')){document.getElementById('saveImage').src=data}else{document.getElementById('imageArea').style.display='none';document.getElementById('error').style.display='block'}
})();
</script></body></html>
