<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Closet Drawers｜投稿テンプレート 人数選択テスト</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root {
  --bg:#fbf8f4;
  --paper:#fffdfa;
  --ink:#3d291f;
  --muted:#9a765f;
  --orange:#d88449;
  --line:#e6c9b4;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:
    radial-gradient(circle at 20% 10%, rgba(232,198,170,.13), transparent 28%),
    radial-gradient(circle at 85% 40%, rgba(232,198,170,.10), transparent 25%),
    var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
}
.page{max-width:1180px;margin:0 auto;padding:26px 18px 70px}
.topnav{display:flex;justify-content:space-between;color:#b17450;font:600 12px Georgia,serif;letter-spacing:.17em}
.hero{text-align:center;padding:46px 0 28px}
.hero h1{margin:0;font:500 clamp(34px,6vw,60px) Georgia,serif;letter-spacing:.01em}
.hero p{margin:10px 0 0;color:#ae8063;font-size:14px;letter-spacing:.08em}
.panel{
  background:rgba(255,253,250,.9);
  border:1px solid var(--line);
  border-radius:22px;
  padding:22px;
  box-shadow:0 8px 28px rgba(91,56,34,.06);
}
.select-title{text-align:center;font:700 14px Georgia,serif;letter-spacing:.12em;color:#7b5845}
.select-sub{text-align:center;color:#a17c66;font-size:12px;margin-top:5px}
.people-buttons{
  margin:18px auto 0;
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:9px;
  max-width:760px;
}
.people-buttons button{
  appearance:none;
  border:1px solid var(--line);
  background:#fff;
  color:#6d4d3b;
  border-radius:999px;
  padding:12px 6px;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
  transition:.18s ease;
}
.people-buttons button:active{transform:scale(.96)}
.people-buttons button.active{
  background:var(--orange);
  color:white;
  border-color:var(--orange);
  box-shadow:0 5px 14px rgba(216,132,73,.20);
}
.result-label{
  text-align:center;
  margin:24px 0 14px;
  color:#9c745e;
  font-size:12px;
}
.templates{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:22px;
  align-items:start;
}
.template-card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  padding:14px;
  min-width:0;
}
.template-card h2{
  text-align:center;
  font-size:14px;
  margin:2px 0 12px;
  letter-spacing:.04em;
}
.preview-shell{
  width:100%;
  aspect-ratio:1/1;
  overflow:hidden;
  border:1px solid #edd9c9;
  background:#fff;
}
.preview-host{
  display:block;
  width:100%;
  height:100%;
}
.actions{margin-top:12px}
.save-btn{
  width:100%;
  border:0;
  background:linear-gradient(90deg,#e79a3a,#c47b46);
  color:#fff;
  border-radius:999px;
  padding:13px 10px;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
}
.save-btn:active{transform:scale(.985)}
.toast{
  position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);
  background:#493329;color:#fff;padding:10px 16px;border-radius:999px;
  font-size:12px;opacity:0;pointer-events:none;transition:.2s ease;z-index:99;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.note{text-align:center;color:#a17b64;font-size:11px;line-height:1.8;margin-top:20px}
@media(max-width:760px){
  .page{padding:22px 14px 56px}
  .hero{padding:38px 0 24px}
  .panel{padding:16px}
  .people-buttons{grid-template-columns:repeat(3,1fr)}
  .templates{grid-template-columns:1fr 1fr;gap:10px}
  .template-card{padding:8px;border-radius:14px}
  .template-card h2{font-size:11px;margin-bottom:8px}
  .save-btn{font-size:12px;padding:11px 5px}
}
</style>
</head>
<body>
<div class="page">
  <div class="topnav"><span>← MENU</span><span>LOTTERY</span></div>

  <section class="hero">
    <h1>POST TEMPLATE</h1>
    <p>コーデ投稿用テンプレート</p>
  </section>

  <section class="panel">
    <div class="select-title">SELECT PLAYERS</div>
    <div class="select-sub">使う人数を選んでね。</div>

    <div class="people-buttons" id="peopleButtons">
      <button data-n="1" class="active">1人</button>
      <button data-n="2">2人</button>
      <button data-n="3">3人</button>
      <button data-n="4">4人</button>
      <button data-n="5">5人</button>
      <button data-n="6">6人</button>
    </div>

    <div class="result-label" id="resultLabel">1人用テンプレートを表示中</div>

    <div class="templates">
      <article class="template-card">
        <h2>ファッションくじ</h2>
        <div class="preview-shell" id="fashionCapture"><div class="preview-host" id="fashionHost"></div></div>
        <div class="actions"><button class="save-btn" data-save="fashion">画像を保存</button></div>
      </article>

      <article class="template-card">
        <h2>今週のファッションくじ</h2>
        <div class="preview-shell" id="weeklyCapture"><div class="preview-host" id="weeklyHost"></div></div>
        <div class="actions"><button class="save-btn" data-save="weekly">画像を保存</button></div>
      </article>
    </div>

    <div class="note">
      人数ボタンを押すと、左右それぞれ同じ人数用テンプレートへ切り替わります。<br>
      保存ボタンもテストできるようにしています。
    </div>
  </section>
</div>

<div class="toast" id="toast">切り替えました</div>

.brand-main{font-size:15px;font-weight:700;line-height:1.05;margin-top:2px}
.brand-sub{margin-top:4px;color:var(--orange);font-size:8px;font-weight:700;letter-spacing:.08em}
.hash{text-align:right;font-size:19px;font-weight:800;color:var(--orange);letter-spacing:.12em;line-height:1}
.hash small{display:block;color:var(--ink);font-size:7px;letter-spacing:.12em;margin-top:6px}

.theme{
  border-top:1px solid var(--orange2);border-bottom:1px solid var(--line);
  padding:7px 0 6px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
}
.theme-label{font-size:7px;font-weight:800;letter-spacing:.08em;color:#85604c;margin-bottom:3px}
.theme-line{height:12px;border-bottom:1px solid var(--orange2)}

.players{
  min-height:0;display:grid;gap:8px;
  justify-items:center;align-content:center;
}
.p1{grid-template-columns:1fr;padding:0 27%}
.p2{grid-template-columns:repeat(2,1fr);padding:0 13%}
.p3{grid-template-columns:repeat(3,1fr);padding:0 3%}
.p4{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,max-content);padding:0 18%}
.p5,.p6{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,max-content);padding:0 7%}
.p5 .player:nth-child(4){grid-column:1}
.p5 .player:nth-child(5){grid-column:2}

.player{
  width:100%;min-width:0;
  display:flex;flex-direction:column;gap:4px;
}
.avatar{
  width:100%;aspect-ratio:1/1;
  background:#fff;border:1px solid var(--line);border-radius:10px;
  position:relative;overflow:hidden;
}
.name{
  height:20px;border:1px solid var(--line);border-radius:7px;
  display:flex;align-items:center;padding:0 7px;
  font-size:7px;font-weight:800;background:#fff;
}
.bottom{display:grid;gap:5px}
.memo-label{display:flex;align-items:center;gap:8px;font-size:8px;font-weight:800}
.memo-label:after{content:"";flex:1;border-bottom:1px dashed var(--orange2)}
.memo-lines{
  height:18px;opacity:.55;
  background:repeating-linear-gradient(to bottom,transparent 0,transparent 5px,
    rgba(216,120,69,.55) 5px,rgba(216,120,69,.55) 6px);
}
.footer{text-align:center;font-size:6px;letter-spacing:.04em;color:#8e6e5b}

.note{
  margin-top:24px;padding:14px 16px;background:#fff;border:1px solid var(--line);
  border-radius:14px;color:#765b4d;font-size:12px;line-height:1.75;
}
@media(max-width:500px){
  .page{padding:18px 12px 40px}
  .grid{grid-template-columns:1fr}
}

/* v10 — 4〜6人だけ構造を作り直し。
   1〜3人はv8のまま。
   4〜6人は「行」を明示し、アバター部分は width = height の真四角。 */
.rows-layout{
  display:flex !important;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:7px !important;
  padding:0 !important;
}
.rows-layout .player-row{
  width:100%;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  gap:8px;
}
.rows-layout .player{
  flex:0 0 auto;
  width:17.5%;
  display:flex;
  flex-direction:column;
  gap:4px;
}
.rows-layout .avatar{
  width:100% !important;
  height:auto !important;
  aspect-ratio:1 / 1 !important;
  flex:none !important;
}
.rows-layout .name{
  width:100%;
  height:18px;
  min-height:18px;
}

/* 4人は2列なので少しだけ大きく */
.p4.rows-layout .player{
  width:20%;
}

/* 5・6人は3列×2段 */
.p5.rows-layout .player,
.p6.rows-layout .player{
  width:17.5%;
}

/* 元のgrid指定を4〜6人だけ無効化 */
.p4,.p5,.p6{
  grid-template-columns:none !important;
  grid-template-rows:none !important;
}

/* 狭い画面でも正方形を維持しつつ、縦に収める */
@media(max-width:380px){
  .p4.rows-layout .player{width:18.5%;}
  .p5.rows-layout .player,
  .p6.rows-layout .player{width:16%;}
  .rows-layout .name{height:17px;min-height:17px;font-size:6.5px;}
}

.brand-main{font-size:15px;font-weight:700;line-height:1.05;margin-top:2px}
.brand-sub{margin-top:4px;color:var(--orange);font-size:8px;font-weight:700;letter-spacing:.08em}
.hash{text-align:right;font-size:19px;font-weight:800;color:var(--orange);letter-spacing:.12em;line-height:1}
.hash small{display:block;color:var(--ink);font-size:7px;letter-spacing:.12em;margin-top:6px}

.theme{
  border-top:1px solid var(--orange2);border-bottom:1px solid var(--line);
  padding:7px 0 6px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
}
.theme-label{font-size:7px;font-weight:800;letter-spacing:.08em;color:#85604c;margin-bottom:3px}
.theme-line{height:12px;border-bottom:1px solid var(--orange2)}

.players{
  min-height:0;display:grid;gap:8px;
  justify-items:center;align-content:center;
}
.p1{grid-template-columns:1fr;padding:0 27%}
.p2{grid-template-columns:repeat(2,1fr);padding:0 13%}
.p3{grid-template-columns:repeat(3,1fr);padding:0 3%}
.p4{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,max-content);padding:0 18%}
.p5,.p6{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,max-content);padding:0 7%}
.p5 .player:nth-child(4){grid-column:1}
.p5 .player:nth-child(5){grid-column:2}

.player{
  width:100%;min-width:0;
  display:flex;flex-direction:column;gap:4px;
}
.avatar{
  width:100%;aspect-ratio:1/1;
  background:#fff;border:1px solid var(--line);border-radius:10px;
  position:relative;overflow:hidden;
}
.name{
  height:20px;border:1px solid var(--line);border-radius:7px;
  display:flex;align-items:center;padding:0 7px;
  font-size:7px;font-weight:800;background:#fff;
}
.bottom{display:grid;gap:5px}
.memo-label{display:flex;align-items:center;gap:8px;font-size:8px;font-weight:800}
.memo-label:after{content:"";flex:1;border-bottom:1px dashed var(--orange2)}
.memo-lines{
  height:18px;opacity:.55;
  background:repeating-linear-gradient(to bottom,transparent 0,transparent 5px,
    rgba(216,120,69,.55) 5px,rgba(216,120,69,.55) 6px);
}
.footer{text-align:center;font-size:6px;letter-spacing:.04em;color:#8e6e5b}

.note{
  margin-top:24px;padding:14px 16px;background:#fff;border:1px solid var(--line);
  border-radius:14px;color:#765b4d;font-size:12px;line-height:1.75;
}
@media(max-width:500px){
  .page{padding:18px 12px 40px}
  .grid{grid-template-columns:1fr}
}

/* v10 — 4〜6人だけ構造を作り直し。
   1〜3人はv8のまま。
   4〜6人は「行」を明示し、アバター部分は width = height の真四角。 */
.rows-layout{
  display:flex !important;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:7px !important;
  padding:0 !important;
}
.rows-layout .player-row{
  width:100%;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  gap:8px;
}
.rows-layout .player{
  flex:0 0 auto;
  width:17.5%;
  display:flex;
  flex-direction:column;
  gap:4px;
}
.rows-layout .avatar{
  width:100% !important;
  height:auto !important;
  aspect-ratio:1 / 1 !important;
  flex:none !important;
}
.rows-layout .name{
  width:100%;
  height:18px;
  min-height:18px;
}

/* 4人は2列なので少しだけ大きく */
.p4.rows-layout .player{
  width:20%;
}

/* 5・6人は3列×2段 */
.p5.rows-layout .player,
.p6.rows-layout .player{
  width:17.5%;
}

/* 元のgrid指定を4〜6人だけ無効化 */
.p4,.p5,.p6{
  grid-template-columns:none !important;
  grid-template-rows:none !important;
}

/* 狭い画面でも正方形を維持しつつ、縦に収める */
@media(max-width:380px){
  .p4.rows-layout .player{width:18.5%;}
  .p5.rows-layout .player,
  .p6.rows-layout .player{width:16%;}
  .rows-layout .name{height:17px;min-height:17px;font-size:6.5px;}
}

`;

let selected = 1;

function mount(hostId, css, sectionHtml) {
  const host = document.getElementById(hostId);
  host.innerHTML = "";
  const shadow = host.attachShadow ? host.attachShadow({mode:"open"}) : null;
  const root = shadow || host;
  root.innerHTML = `
    <style>
      :host { display:block; width:100%; height:100%; }
      html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#fff}
      .sample-wrap,.sample-title,.page,.intro,.grid,.note{display:none!important}
      ${css}
      .tpl{
        width:100%!important;
        height:100%!important;
        aspect-ratio:1/1!important;
        margin:0!important;
        box-shadow:none!important;
        border:0!important;
        border-radius:0!important;
      }
    </style>
    ${sectionHtml}
  `;
}

function showToast(text) {
  const t = document.getElementById("toast");
  t.textContent = text;
  t.classList.add("show");
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove("show"), 1200);
}

function render(n) {
  selected = n;
  document.querySelectorAll("#peopleButtons button").forEach(btn => {
    btn.classList.toggle("active", Number(btn.dataset.n) === n);
  });
  document.getElementById("resultLabel").textContent = `${n}人用テンプレートを表示中`;

  // Recreate hosts because attachShadow can only be called once per node.
  const fOld = document.getElementById("fashionHost");
  const wOld = document.getElementById("weeklyHost");
  fOld.replaceWith(Object.assign(document.createElement("div"), {id:"fashionHost",className:"preview-host"}));
  wOld.replaceWith(Object.assign(document.createElement("div"), {id:"weeklyHost",className:"preview-host"}));

  mount("fashionHost", fashionCSS, fashionSamples[n]);
  mount("weeklyHost", weeklyCSS, weeklySamples[n]);
}

document.getElementById("peopleButtons").addEventListener("click", e => {
  const btn = e.target.closest("button[data-n]");
  if (!btn) return;
  const n = Number(btn.dataset.n);
  render(n);
  showToast(`${n}人用に切り替えました`);
});

async function saveCard(kind) {
  const target = document.getElementById(kind === "fashion" ? "fashionCapture" : "weeklyCapture");
  if (!window.html2canvas) {
    showToast("保存ライブラリを読み込めませんでした");
    return;
  }
  showToast("画像を作成中…");
  try {
    const canvas = await html2canvas(target, {
      backgroundColor:"#ffffff",
      scale:3,
      useCORS:true
    });
    const a = document.createElement("a");
    a.download = `${kind === "fashion" ? "fashion-lottery" : "weekly-fashion-lottery"}-${selected}people.png`;
    a.href = canvas.toDataURL("image/png");
    a.click();
    showToast("画像を保存しました");
  } catch (err) {
    console.error(err);
    showToast("保存テストでエラーが発生しました");
  }
}

document.querySelectorAll(".save-btn").forEach(btn => {
  btn.addEventListener("click", () => saveCard(btn.dataset.save));
});

render(1);
</script>
</body>
</html>
