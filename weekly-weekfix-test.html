<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>今週のファッションくじ｜週更新修正テスト</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fbfaf8}
#weeklyFrame{display:block;width:100%;height:100dvh;border:0;background:#fbfaf8}
</style>
</head>
<body>
<iframe id="weeklyFrame" src="weekly.html?weekfix-base=1" title="今週のファッションくじ"></iframe>
<script>
const frame = document.getElementById('weeklyFrame');

frame.addEventListener('load', () => {
  const doc = frame.contentDocument;
  if (!doc) return;

  const patch = doc.createElement('script');
  patch.textContent = `
  (() => {
    const WEEK_MS = 7 * 24 * 60 * 60 * 1000;
    const SEASONS_13W = ['SPRING','SUMMER','AUTUMN','WINTER'];

    // 2026-03-02(月) 00:00 JST を SPRING WEEK 01 の基準日にする。
    // 13週ごとに SPRING → SUMMER → AUTUMN → WINTER と進む。
    function fixedThemeNow(){
      const cur = mondayOnOrBefore(now);
      const anchor = new Date(2026, 2, 2);
      anchor.setHours(0,0,0,0);

      const elapsedWeeks = Math.floor((cur - anchor) / WEEK_MS);
      const cycleWeek = ((elapsedWeeks % 52) + 52) % 52;
      const seasonIndex = Math.floor(cycleWeek / 13);
      const idx = cycleWeek % 13;
      const s = SEASONS_13W[seasonIndex];

      const block = WEEKLY.filter(x => x.season === s);
      return [block[idx], idx, s];
    }

    [theme, weekIndex, season] = fixedThemeNow();

    const seasonLabel = document.getElementById('seasonLabel');
    if (seasonLabel) {
      seasonLabel.textContent =
        season + ' / WEEK ' + String(weekIndex + 1).padStart(2,'0');
    }

    // すでに結果カードを開いている場合でも、その場で正しい週へ更新。
    const card = document.getElementById('weeklyCard');
    if (card && card.classList.contains('show')) {
      const color = document.getElementById('wColor');
      const style = document.getElementById('wStyle');
      const point = document.getElementById('wPoint');
      const advice = document.getElementById('wAdvice');

      if (color) color.innerHTML = weeklyColorHTML(theme.color);
      if (style) style.textContent = theme.style;
      if (point) point.textContent = theme.point;
      if (advice) advice.textContent = theme.advice;

      const cLink = document.getElementById('wColorDict');
      const sLink = document.getElementById('wStyleDict');
      const pLink = document.getElementById('wPointDict');
      if (cLink) cLink.href = 'dictionary.html?tab=color&q=' + encodeURIComponent(theme.color);
      if (sLink) sLink.href = 'dictionary.html?tab=style&q=' + encodeURIComponent(theme.style);
      if (pLink) pLink.href = 'dictionary.html?tab=point&q=' + encodeURIComponent(theme.point);
    }

    // 季節装飾も新しいシーズンへ合わせる。
    const seasonLayer = document.getElementById('seasonLayer');
    if (seasonLayer) seasonLayer.innerHTML = '';
    if (typeof effect === 'function') effect();
  })();
  `;
  doc.body.appendChild(patch);
});
</script>
</body>
</html>
