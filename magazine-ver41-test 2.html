*{box-sizing:border-box}
body{margin:0;background:#fbfaf8;color:#2b211b;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
.wrap{max-width:760px;margin:auto;padding:22px 18px 54px}
.back{color:#9b6a45;text-decoration:none;font-size:12px}

.empty{font-size:14px;color:#8b6d58;padding:20px 4px}

.cover-view{height:min(100%,calc((100vw - 20px)*4/3));aspect-ratio:3/4;max-width:calc((100dvh - 150px)*3/4);box-shadow:8px 8px 20px #6e4a2a24;background:#fff;position:relative;overflow:hidden;border:1px solid #d7c1a8}

.cover-view img{width:100%;height:100%;object-fit:contain;display:block}
.spread{width:min(100%,calc((100dvh - 150px)*4/3));aspect-ratio:4/3;max-height:calc(100dvh - 150px);display:grid;grid-template-columns:1fr 1fr;gap:2px;perspective:1500px}
.page{min-width:0;min-height:0;background:#fffdf9;box-shadow:0 5px 16px #6e4a2a18;overflow:hidden;position:relative}
.page img{display:block;width:100%;height:100%;object-fit:contain}
.page.blank{background:#fffdf9}
.page.left{transform-origin:right center}
.page.right{transform-origin:left center}
.spread.turn-next .page.right{animation:turnNext .62s cubic-bezier(.2,.72,.25,1) both}
.spread.turn-prev .page.left{animation:turnPrev .62s cubic-bezier(.2,.72,.25,1) both}

@keyframes turnPrev{0%{transform:rotateY(0);filter:brightness(1)}42%{filter:brightness(.78);box-shadow:12px 0 18px #5b3b2528}100%{transform:rotateY(18deg);filter:brightness(1)}}
.reader-foot{flex:0 0 48px;display:flex;align-items:center;justify-content:space-between;color:#8b6d58;font-size:11px;gap:8px}
.navbtn{border:1px solid #c98a4d;background:#fffaf4;color:#805536;border-radius:24px;padding:10px 15px;font-size:12px}
.navbtn:disabled{opacity:.35}
.tapzone{position:absolute;top:0;bottom:0;width:50%;z-index:4;border:0;background:transparent;padding:0}
.tapzone.left{left:0}.tapzone.right{right:0}
.spread .page{z-index:1}.spread .page img{pointer-events:none}
@media(orientation:landscape){.reader:before{content:"スマートフォンを縦向きにしてご覧ください";position:absolute;inset:45% 12px auto;text-align:center;color:#805536;z-index:20}.reader.show .book-area{opacity:.08}}

const $=id=>document.getElementById(id);
let issues=[],active=null,view=-1,direction="";
const spreadCount=issue=>Math.ceil(issue.pages.length/2);
function renderIssues(){
 const box=$("issues");box.replaceChildren();
 if(!issues.length){box.innerHTML='<p class="empty">公開中の雑誌はまだありません。</p>';return;}
 issues.forEach(issue=>{
  const b=document.createElement("button");b.type="button";b.className="issue";
  const img=document.createElement("img");img.src=issue.cover;img.alt=issue.title+" "+issue.issue;
  const strong=document.createElement("strong");strong.textContent=issue.issue;
  const small=document.createElement("small");small.textContent=issue.publishedAt;
  b.append(img,strong,small);b.addEventListener("click",()=>openIssue(issue));box.append(b);
 });
}
function openIssue(issue){active=issue;view=-1;$("reader").classList.add("show");renderBook();}
function addCover(src,alt){const v=document.createElement("div");v.className="cover-view";const img=document.createElement("img");img.src=src;img.alt=alt;v.append(img);$("bookArea").append(v);}
function renderBook(){
 const area=$("bookArea");area.replaceChildren();
 const count=spreadCount(active);
 if(view===-1){addCover(active.cover,"表紙");$("issueLabel").textContent=active.issue+" / 表紙";}
 else if(view===count){addCover(active.backCover,"裏表紙");$("issueLabel").textContent=active.issue+" / 裏表紙";}
 else{
  const spread=document.createElement("div");spread.className="spread"+(direction==="next"?" turn-next":direction==="prev"?" turn-prev":"");direction="";
  const first=view*2;
  for(let i=0;i<2;i++){
   const page=document.createElement("div");page.className="page "+(i===0?"left":"right");
   const pageData=active.pages[first+i];
   if(pageData){const img=document.createElement("img");img.src=pageData;img.alt=(first+i+1)+"ページ目";page.append(img);}
   else page.classList.add("blank");
   spread.append(page);
  }
  const left=document.createElement("button"),right=document.createElement("button");
  left.type=right.type="button";left.className="tapzone left";right.className="tapzone right";
  left.setAttribute("aria-label","前の見開き");right.setAttribute("aria-label","次の見開き");
  left.addEventListener("click",prev);right.addEventListener("click",next);spread.append(left,right);area.append(spread);
  const lastPage=Math.min(first+2,active.pages.length);
  $("issueLabel").textContent=active.issue+" / "+(first+1)+"–"+lastPage+"ページ目";
 }
 $("prev").disabled=view===-1;$("next").disabled=view===count;
}
function next(){if(!active||view>=spreadCount(active))return;view++;direction="next";renderBook();}
function prev(){if(!active||view<0)return;view--;direction="prev";renderBook();}
function closeReader(){$("reader").classList.remove("show");active=null;}
$("next").addEventListener("click",next);$("prev").addEventListener("click",prev);$("close").addEventListener("click",closeReader);
document.addEventListener("keydown",e=>{if(!$("reader").classList.contains("show"))return;if(e.key==="ArrowRight")next();if(e.key==="ArrowLeft")prev();if(e.key==="Escape")closeReader();});
try{
 if(!EMBEDDED_DATA||!Array.isArray(EMBEDDED_DATA.issues))throw new Error("invalid data");
 issues=EMBEDDED_DATA.issues.slice().sort((a,b)=>String(b.publishedAt).localeCompare(String(a.publishedAt)));
 renderIssues();
}catch(error){$("issues").textContent="雑誌データを表示できませんでした。";console.error(error);}
